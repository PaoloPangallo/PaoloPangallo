name: Portfolio checks
on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check-portfolio.py"
      - ".github/workflows/portfolio-checks.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check-portfolio.py"
      - ".github/workflows/portfolio-checks.yml"
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check docs/script.js
      - name: HTML, links, accessibility and CV checks
        run: python3 scripts/check-portfolio.py
