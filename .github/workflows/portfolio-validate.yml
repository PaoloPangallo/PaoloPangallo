name: Portfolio validation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/check-portfolio.py'
      - '.github/workflows/portfolio-validate.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check-portfolio.py'
      - '.github/workflows/portfolio-validate.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check docs/script.js
      - name: Static portfolio integrity
        run: python3 scripts/check-portfolio.py
